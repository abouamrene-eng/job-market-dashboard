services:
  - type: web
    # Deliberately a different name from the existing "job-market-dashboard"
    # native-Python service: Render's Blueprint sync links to an existing
    # service by name and won't switch its runtime (see the "Reverte
    # render.yaml" commit) - a distinct name forces a genuinely new Docker
    # service to be created instead. Once verified, rename it (Settings ->
    # Name) to reclaim a cleaner URL and delete the old service.
    name: job-market-dashboard-docker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
