<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amine's Job Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<a href="#main-content" class="skip-link">Aller au contenu</a>

<header class="app-header">
  <div class="container">
    <a href="/" class="app-logo">
      <span class="app-logo-mark">AB</span>
      <span class="app-title-group">
        <span class="app-title">Job Dashboard</span>
        <span class="app-subtitle" id="sync-status">Synchronisation…</span>
      </span>
    </a>
    <div class="app-header-actions">
      <button id="btn-insights" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        Tendances
      </button>
      <button id="btn-refresh" class="btn btn-icon btn-secondary" title="Actualiser" aria-label="Actualiser les offres">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main-content">
  <section class="stats-section container">
    <h2 class="section-label">Stats du jour</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon tone-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        </div>
        <div class="stat-label">Offres</div>
        <div class="stat-value tnum" id="stat-total">–</div>
        <div class="stat-delta" id="stat-total-delta"></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon tone-accent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
        </div>
        <div class="stat-label">Salaire moyen</div>
        <div class="stat-value tnum" id="stat-salary">–</div>
        <div class="stat-delta" id="stat-salary-delta">Médiane du marché</div>
      </div>
      <div class="stat-card" id="card-top-matches" data-clickable="true" role="button" tabindex="0">
        <div class="stat-icon tone-success">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4L12 3z"/></svg>
        </div>
        <div class="stat-label">Top matches</div>
        <div class="stat-value tnum" id="stat-top">–</div>
        <div class="stat-delta">Score ≥ 90</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon tone-warning">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </div>
        <div class="stat-label">Candidatures</div>
        <div class="stat-value tnum" id="stat-applied">–</div>
        <div class="stat-delta" id="stat-applied-delta"></div>
      </div>
    </div>
  </section>

  <div class="container main-layout">

    <aside class="filters-panel">
      <div class="filters-header">
        <span class="filters-title">Filtres <span class="filters-count visually-hidden" id="filters-count-badge"></span></span>
        <button id="btn-reset" class="btn-link" style="font-size: 13px; visibility: hidden;">Réinitialiser</button>
      </div>

      <fieldset class="filter-group">
        <legend>Score</legend>
        <select id="filter-score" class="select-control">
          <option value="all">Tous les scores</option>
          <option value="top">Excellent (&gt; 75)</option>
          <option value="good">Bon (60-75)</option>
        </select>
      </fieldset>

      <fieldset class="filter-group">
        <legend>Secteur</legend>
        <div id="filter-sector">
          <label class="filter-option"><input type="checkbox" value="Conseil" checked> Conseil</label>
          <label class="filter-option"><input type="checkbox" value="Tech" checked> Tech</label>
          <label class="filter-option"><input type="checkbox" value="Industrie" checked> Industrie</label>
          <label class="filter-option"><input type="checkbox" value="Energie" checked> Énergie</label>
          <label class="filter-option"><input type="checkbox" value="Finance" checked> Finance</label>
          <label class="filter-option"><input type="checkbox" value="Insurtech" checked> Insurtech</label>
        </div>
      </fieldset>

      <fieldset class="filter-group">
        <legend>Localisation</legend>
        <div id="filter-location">
          <label class="filter-option"><input type="checkbox" value="Remote" checked> Remote</label>
          <label class="filter-option"><input type="checkbox" value="Mixte" checked> Mixte</label>
          <label class="filter-option"><input type="checkbox" value="IDF" checked> Île-de-France</label>
          <label class="filter-option"><input type="checkbox" value="Province" checked> Province</label>
        </div>
      </fieldset>

      <fieldset class="filter-group">
        <legend>Salaire minimum</legend>
        <input type="range" id="filter-salary" min="60000" max="110000" step="1000" value="60000">
        <div class="range-value-row"><span>Min : <strong id="filter-salary-value">60 000 €</strong></span></div>
      </fieldset>

      <fieldset class="filter-group">
        <legend>Statut</legend>
        <select id="filter-status" class="select-control">
          <option value="all">Tous</option>
          <option value="new">Non appliqué</option>
          <option value="applied">Appliqué</option>
          <option value="interview">Entretien</option>
          <option value="offer">Offre</option>
          <option value="rejected">Refusé</option>
        </select>
      </fieldset>
    </aside>

    <section aria-labelledby="feed-heading">
      <h2 id="feed-heading" class="visually-hidden">Offres d'emploi</h2>
      <div class="feed-toolbar">
        <div class="feed-toolbar-left">
          <label for="sort-select">Tri :</label>
          <select id="sort-select" class="select-control">
            <option value="score">Score</option>
            <option value="salary">Salaire</option>
            <option value="recent">Plus récent</option>
          </select>
        </div>
        <div id="jobs-count" class="jobs-count" aria-live="polite"></div>
      </div>

      <div id="jobs-feed" class="jobs-feed"></div>
      <div id="jobs-empty" class="empty-state hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <p>Aucune offre ne correspond à ces filtres.</p>
        <button id="btn-empty-reset" class="btn btn-secondary">Réinitialiser les filtres</button>
      </div>

      <div class="pagination">
        <button id="btn-prev" class="btn btn-secondary btn-sm">&larr; Précédent</button>
        <span id="page-indicator" class="page-indicator">Page 1</span>
        <button id="btn-next" class="btn btn-secondary btn-sm">Suivant &rarr;</button>
      </div>
    </section>
  </div>
</main>

<div id="job-modal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal-panel">
    <button id="modal-close" class="modal-close" aria-label="Fermer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
    </button>
    <div id="modal-content"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/filters.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
